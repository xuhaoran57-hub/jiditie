<?xml version="1.0" encoding="UTF-8"?>
<!-- 项目内手工绘制的 Q 版玩家四帧图集；透明背景，单帧 64x64。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="64" viewBox="0 0 256 64">
  <title>潮汐线 Q 版玩家动作帧</title>
  <defs>
    <style>
      .ink { stroke: #15263c; stroke-linecap: round; stroke-linejoin: round; }
      .skin { fill: #f3c5a2; }
      .shirt { fill: #36c8bb; }
      .shirt-shadow { fill: #167c83; }
      .hair { fill: #152c44; }
      .shoe { stroke: #07121e; stroke-width: 4; }
    </style>
  </defs>

  <!-- idle -->
  <g transform="translate(0 0)">
    <path d="M26 45l-2 9M38 45l2 9" class="shoe" fill="none"/>
    <rect x="20" y="27" width="24" height="22" rx="8" class="shirt-shadow ink" stroke-width="2"/>
    <rect x="22" y="25" width="20" height="20" rx="7" class="shirt ink" stroke-width="2"/>
    <path d="M22 32l-7 7M42 32l7 7" class="skin ink" fill="none" stroke-width="3"/>
    <circle cx="32" cy="18" r="12" class="skin ink" stroke-width="2"/>
    <path d="M21 17c1-10 20-15 23 1l-4 1-3-5-4 4-6-3-3 5z" class="hair ink" stroke-width="2"/>
    <circle cx="28" cy="20" r="1.5" fill="#15263c"/>
    <circle cx="36" cy="20" r="1.5" fill="#15263c"/>
    <path d="M29 25c2 1 4 1 6 0" class="ink" fill="none" stroke-width="1.5"/>
    <rect x="14" y="29" width="6" height="13" rx="2" fill="#28445a" class="ink" stroke-width="1.5"/>
  </g>

  <!-- step A -->
  <g transform="translate(64 0)">
    <path d="M26 45l-5 8M38 45l5 7" class="shoe" fill="none"/>
    <rect x="20" y="27" width="24" height="22" rx="8" class="shirt-shadow ink" stroke-width="2"/>
    <rect x="22" y="25" width="20" height="20" rx="7" class="shirt ink" stroke-width="2"/>
    <path d="M22 32l-8 5M42 32l8 5" class="skin ink" fill="none" stroke-width="3"/>
    <circle cx="32" cy="18" r="12" class="skin ink" stroke-width="2"/>
    <path d="M21 17c1-10 20-15 23 1l-4 1-3-5-4 4-6-3-3 5z" class="hair ink" stroke-width="2"/>
    <circle cx="28" cy="20" r="1.5" fill="#15263c"/>
    <circle cx="36" cy="20" r="1.5" fill="#15263c"/>
    <path d="M29 25c2 1 4 1 6 0" class="ink" fill="none" stroke-width="1.5"/>
    <rect x="14" y="29" width="6" height="13" rx="2" fill="#28445a" class="ink" stroke-width="1.5"/>
  </g>

  <!-- step B -->
  <g transform="translate(128 0)">
    <path d="M26 45l-5 7M38 45l5 8" class="shoe" fill="none"/>
    <rect x="20" y="27" width="24" height="22" rx="8" class="shirt-shadow ink" stroke-width="2"/>
    <rect x="22" y="25" width="20" height="20" rx="7" class="shirt ink" stroke-width="2"/>
    <path d="M22 32l-8 5M42 32l8 5" class="skin ink" fill="none" stroke-width="3"/>
    <circle cx="32" cy="18" r="12" class="skin ink" stroke-width="2"/>
    <path d="M21 17c1-10 20-15 23 1l-4 1-3-5-4 4-6-3-3 5z" class="hair ink" stroke-width="2"/>
    <circle cx="28" cy="20" r="1.5" fill="#15263c"/>
    <circle cx="36" cy="20" r="1.5" fill="#15263c"/>
    <path d="M29 25c2 1 4 1 6 0" class="ink" fill="none" stroke-width="1.5"/>
    <rect x="14" y="29" width="6" height="13" rx="2" fill="#28445a" class="ink" stroke-width="1.5"/>
  </g>

  <!-- guide wave -->
  <g transform="translate(192 0)">
    <path d="M26 45l-3 9M38 45l3 9" class="shoe" fill="none"/>
    <rect x="20" y="27" width="24" height="22" rx="8" class="shirt-shadow ink" stroke-width="2"/>
    <rect x="22" y="25" width="20" height="20" rx="7" class="shirt ink" stroke-width="2"/>
    <path d="M22 32l-8 6M42 32l10-12" class="skin ink" fill="none" stroke-width="3"/>
    <circle cx="32" cy="18" r="12" class="skin ink" stroke-width="2"/>
    <path d="M21 17c1-10 20-15 23 1l-4 1-3-5-4 4-6-3-3 5z" class="hair ink" stroke-width="2"/>
    <circle cx="28" cy="20" r="1.5" fill="#15263c"/>
    <circle cx="36" cy="20" r="1.5" fill="#15263c"/>
    <path d="M29 25c2 1 4 1 6 0" class="ink" fill="none" stroke-width="1.5"/>
    <rect x="14" y="29" width="6" height="13" rx="2" fill="#28445a" class="ink" stroke-width="1.5"/>
    <path d="M49 14c4-3 7-2 9 1M51 9c4-2 7-1 9 1" fill="none" stroke="#7ff0c8" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
